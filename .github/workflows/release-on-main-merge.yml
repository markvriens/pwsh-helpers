name: Release JsonValidator

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: patch
        type: choice
        options:
          - patch

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag=$(git tag --list 'Build-JsonValidator-v*' --sort=-version:refname | head -n 1 || true)

          if [ -z "$latest_tag" ]; then
            current_version="1.0.0"
          else
            current_version="${latest_tag#Build-JsonValidator-v}"
          fi

          IFS='.' read -r major minor patch <<< "$current_version"
          major=${major:-1}
          minor=${minor:-0}
          patch=${patch:-0}
          patch=$((patch + 1))

          new_version="${major}.${minor}.${patch}"

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=Build-JsonValidator-v${new_version}" >> "$GITHUB_OUTPUT"

      - name: Update project version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          csproj_path = pathlib.Path('src/Modules/Build-JsonValidator/Build-JsonValidator.csproj')
          psd1_path = pathlib.Path('src/Modules/Build-JsonValidator/Build-JsonValidator.psd1')

          new_version = '${{ steps.version.outputs.version }}'
          sha = '${{ github.sha }}'

          csproj_text = csproj_path.read_text(encoding='utf-8')
          csproj_text = re.sub(r'<Version>.*?</Version>', f'<Version>{new_version}</Version>', csproj_text, count=1, flags=re.S)
          csproj_text = re.sub(r'<FileVersion>.*?</FileVersion>', f'<FileVersion>{new_version}</FileVersion>', csproj_text, count=1, flags=re.S)
          csproj_text = re.sub(r'<InformationalVersion>.*?</InformationalVersion>', f'<InformationalVersion>{new_version}+{sha}</InformationalVersion>', csproj_text, count=1, flags=re.S)
          csproj_text = re.sub(r'<PackageVersion>.*?</PackageVersion>', f'<PackageVersion>{new_version}</PackageVersion>', csproj_text, count=1, flags=re.S)
          csproj_path.write_text(csproj_text, encoding='utf-8')

          psd1_text = psd1_path.read_text(encoding='utf-8')
          psd1_text = re.sub(r"(?m)^(\s*ModuleVersion\s*=\s*)'[^']*'", rf"\1'{new_version}'", psd1_text, count=1)
          psd1_path.write_text(psd1_text, encoding='utf-8')
          PY

      - name: Update Changelog
        id: changelog
        uses: natescherer/changelog-management-action@v1
        with:
          mode: release
          releaseVersion: ${{ steps.version.outputs.version }}
          path: src/Modules/Build-JsonValidator/CHANGELOG.md

      - name: Prepare release note artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          version = '${{ steps.version.outputs.version }}'
          changelog_path = pathlib.Path('src/Modules/Build-JsonValidator/CHANGELOG.md')
          changelog_text = changelog_path.read_text(encoding='utf-8')

          section_pattern = rf'(?ms)^## \[{re.escape(version)}\].*?(?=^## \[|\Z)'
          section_match = re.search(section_pattern, changelog_text)
          section_text = section_match.group(0).strip() if section_match else changelog_text.strip()

          release_notes = (
            f"# Build-JsonValidator {version}\n\n"
            "This release was generated from the changelog.\n\n"
            f"{section_text}\n"
          )
          pathlib.Path('release-notes.md').write_text(release_notes, encoding='utf-8')

          changelog_asset = pathlib.Path(f'Build-JsonValidator-{version}-CHANGELOG.md')
          changelog_asset.write_text(changelog_text, encoding='utf-8')
          PY

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Modules/Build-JsonValidator/Build-JsonValidator.csproj
          git add src/Modules/Build-JsonValidator/Build-JsonValidator.psd1
          git add src/Modules/Build-JsonValidator/CHANGELOG.md

          if git diff --cached --quiet; then
            echo "No version change required."
            exit 0
          fi

          git commit -m "Bump Build-JsonValidator version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Build module package
        shell: bash
        run: |
          set -euo pipefail
          pwsh -NoProfile -ExecutionPolicy Bypass -File ./build.ps1

      - name: Zip module output
        shell: bash
        run: |
          set -euo pipefail
          cd release
          zip -r ../Build-JsonValidator-${{ steps.version.outputs.version }}.zip Build-JsonValidator

      - name: Create and push git tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release-notes.md
          files: |
            Build-JsonValidator-${{ steps.version.outputs.version }}.zip
            Build-JsonValidator-${{ steps.version.outputs.version }}-CHANGELOG.md
            release-notes.md