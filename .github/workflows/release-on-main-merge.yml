name: Release JsonValidator

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: false
        default: patch
        type: choice
        options:
          - patch

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine next version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag=$(git tag --list 'Build-JsonValidator-v*' --sort=-version:refname | head -n 1 || true)

          if [ -z "$latest_tag" ]; then
            current_version="1.0.0"
          else
            current_version="${latest_tag#Build-JsonValidator-v}"
          fi

          IFS='.' read -r major minor patch <<< "$current_version"
          major=${major:-1}
          minor=${minor:-0}
          patch=${patch:-0}
          patch=$((patch + 1))

          new_version="${major}.${minor}.${patch}"

          echo "version=${new_version}" >> "$GITHUB_OUTPUT"
          echo "tag=Build-JsonValidator-v${new_version}" >> "$GITHUB_OUTPUT"

      - name: Update project version
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import re

          path = pathlib.Path('src/Build-JsonValidator/Build-JsonValidator.csproj')
          text = path.read_text()
          new_version = '${{ steps.version.outputs.version }}'
          sha = '${{ github.sha }}'

          text = re.sub(r'<Version>.*?</Version>', f'<Version>{new_version}</Version>', text, count=1, flags=re.S)
          text = re.sub(r'<AssemblyVersion>.*?</AssemblyVersion>', f'<AssemblyVersion>{new_version}.0</AssemblyVersion>', text, count=1, flags=re.S)
          text = re.sub(r'<FileVersion>.*?</FileVersion>', f'<FileVersion>{new_version}.0</FileVersion>', text, count=1, flags=re.S)
          text = re.sub(r'<InformationalVersion>.*?</InformationalVersion>', f'<InformationalVersion>{new_version}+{sha}</InformationalVersion>', text, count=1, flags=re.S)

          path.write_text(text)
          PY

      - name: Commit version bump
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/jsonValidator/jsonValidator.csproj

          if git diff --cached --quiet; then
            echo "No version change required."
            exit 0
          fi

          git commit -m "Bump JsonValidator version to ${{ steps.version.outputs.version }}"
          git push origin HEAD:main

      - name: Publish win-x64
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/jsonValidator/jsonValidator.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o publish/win-x64

      - name: Publish linux-x64
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/jsonValidator/jsonValidator.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -o publish/linux-x64

      - name: Zip win-x64 output
        shell: bash
        run: |
          set -euo pipefail
          cd publish/win-x64
          zip -r ../../jsonValidator-${{ steps.version.outputs.version }}-win-x64.zip .

      - name: Zip linux-x64 output
        shell: bash
        run: |
          set -euo pipefail
          cd publish/linux-x64
          zip -r ../../jsonValidator-${{ steps.version.outputs.version }}-linux-x64.zip .

      - name: Create and push git tag
        shell: bash
        run: |
          set -euo pipefail
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            jsonValidator-${{ steps.version.outputs.version }}-win-x64.zip
            jsonValidator-${{ steps.version.outputs.version }}-linux-x64.zip